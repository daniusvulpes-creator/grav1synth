name: Build Grav1synth for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFmpeg through vcpkg
        shell: pwsh
        run: |
          vcpkg install ffmpeg:x64-windows
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Build Grav1synth
        run: cargo build --locked --release

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/grav1synth.exe dist/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" dist/ -ErrorAction Stop
          Compress-Archive -Path dist/* -DestinationPath grav1synth-windows-x64.zip

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: grav1synth-windows-x64
          path: grav1synth-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
